<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sky Ace 1944 🛩️🔥</title>
  <script src="arcade-leaderboard.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body { background:#0a101f; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; }
    #canvas-container { position:relative; width:100vw; height:100vh; max-width:600px; }
    @media (max-width: 600px) { .hud { font-size:14px; } .arcade-nav { font-size:11px; padding:6px 10px; } .bomb-btn { width:60px; height:60px; } }
    canvas { width:100%; height:100%; display:block; background:#0a101f; }
    .arcade-nav { position:absolute; top:16px; right:16px; z-index:100; background:rgba(0,0,0,0.7); border:2px solid #ff9f43; color:#ff9f43; padding:8px 16px; border-radius:8px; font-weight:bold; text-decoration:none; font-size:13px; box-shadow:0 0 15px rgba(255,159,67,0.4); }
    .hud { position:absolute; top:16px; left:16px; font-family:monospace; font-size:18px; font-weight:bold; color:#00f5ff; text-shadow:0 0 10px #00f5ff; pointer-events:none; }
    .bomb-btn { position:absolute; bottom:24px; right:24px; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle,#ff4757,#2f3542); border:3px solid #ff6b81; color:#fff; font-size:24px; font-weight:bold; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(255,71,87,0.6); pointer-events:auto; cursor:pointer; }
    .bomb-btn:active { transform:scale(0.92); }
    #modal { position:absolute; inset:0; background:rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:200; }
    #modal h1 { color:#ff4757; font-size:42px; text-shadow:0 0 20px #ff4757; }
    .btn { background:linear-gradient(135deg,#ff9f43,#ff4757); border:none; color:#fff; padding:12px 32px; font-size:18px; font-weight:bold; border-radius:8px; cursor:pointer; text-decoration:none; box-shadow:0 0 20px rgba(255,71,87,0.5); }
  </style>
</head>
<body>
  <div id="canvas-container">
    <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-nav">🕹️ Arcade Hub</a>
    <div class="hud">SCORE: <span id="score-val">0</span> | BOMBS: <span id="bomb-val">2</span> | LIVES: <span id="lives-val">3</span></div>
    <div class="bomb-btn" onclick="useBomb()">💣</div>
    <canvas id="gameCanvas" width="600" height="800"></canvas>
    <div id="modal">
      <h1 id="modal-title">MISSION FAILED 💥</h1>
      <p style="font-size:20px;">SCORE: <span id="final-score">0</span></p>
      <button class="btn" onclick="restartGame()">SORTIE AGAIN 🔄</button>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="btn" style="background:#222; border:1px solid #ff9f43;">ARCADE HUB 🕹️</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio
    let audioCtx = null;
    function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
    function playSfx(freq, dur) {
      try {
        const c = getAudio(); const osc = c.createOscillator(); const g = c.createGain();
        osc.frequency.value = freq; g.gain.setValueAtTime(0.1, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + dur);
        osc.connect(g); g.connect(c.destination); osc.start(); osc.stop(c.currentTime + dur);
      } catch(e){}
    }

    let score = 0, bombs = 2, lives = 3, isGameOver = false, waveTimer = 0, invincibleTimer = 0;
    let player = { x: 300, y: 680, w: 40, h: 40, shootTimer: 0 };
    let bullets = [], enemies = [], eBullets = [], particles = [];

    const setPos = (cx, cy) => {
      const rect = canvas.getBoundingClientRect();
      player.x = Math.max(30, Math.min(570, ((cx - rect.left) / rect.width) * 600));
      player.y = Math.max(50, Math.min(750, ((cy - rect.top) / rect.height) * 800));
    };

    window.addEventListener('mousemove', e => setPos(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { e.preventDefault(); setPos(e.touches[0].clientX, e.touches[0].clientY); }, { passive:false });
    window.addEventListener('touchstart', e => { e.preventDefault(); setPos(e.touches[0].clientX, e.touches[0].clientY); }, { passive:false });

    function useBomb() {
      if (bombs <= 0 || isGameOver) return;
      bombs--;
      document.getElementById('bomb-val').textContent = bombs;
      playSfx(100, 0.5);
      // Clear enemies & bullets
      for (const e of enemies) {
        score += 50;
        for (let i=0; i<8; i++) particles.push({ x: e.x, y: e.y, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, color:'#ff4757', life:1 });
      }
      enemies = []; eBullets = [];
    }

    function spawnEnemy() {
      enemies.push({
        x: 40 + Math.random() * 520,
        y: -40,
        vx: (Math.random() - 0.5) * 2,
        vy: 2.5 + Math.random() * 2,
        hp: 2,
        shootTimer: 30 + Math.random() * 60,
        color: ['#ff4757', '#ffa502', '#2ed573'][Math.floor(Math.random() * 3)]
      });
    }

    function restartGame() {
      score = 0; bombs = 2; lives = 3; isGameOver = false; invincibleTimer = 0;
      player.x = 300; player.y = 680;
      bullets = []; enemies = []; eBullets = []; particles = [];
      document.getElementById('score-val').textContent = '0';
      document.getElementById('bomb-val').textContent = '2';
      document.getElementById('lives-val').textContent = '3';
      document.getElementById('modal').style.display = 'none';
      requestAnimationFrame(loop);
    }

    function loop() {
      if (isGameOver) return;

      // Invincibility timer
      if (invincibleTimer > 0) invincibleTimer--;

      // Player Auto Fire
      player.shootTimer++;
      if (player.shootTimer > 8) {
        bullets.push({ x: player.x - 12, y: player.y - 20, vy: -12 });
        bullets.push({ x: player.x + 12, y: player.y - 20, vy: -12 });
        playSfx(800, 0.04);
        player.shootTimer = 0;
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < -20) bullets.splice(i, 1);
      }

      // Spawn Enemies
      waveTimer++;
      if (waveTimer > 40) { spawnEnemy(); waveTimer = 0; }

      // Update Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.vy;
        e.x += e.vx;

        // Enemy Shoot
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          eBullets.push({ x: e.x, y: e.y + 15, vy: 5 });
          e.shootTimer = 70 + Math.random() * 50;
        }

        // Check Bullet Hit
        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
          const b = bullets[bIdx];
          if (Math.hypot(b.x - e.x, b.y - e.y) < 22) {
            e.hp--;
            bullets.splice(bIdx, 1);
            if (e.hp <= 0) {
              score += 100;
              playSfx(250, 0.15);
              for (let p=0; p<6; p++) particles.push({ x: e.x, y: e.y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, color: e.color, life:1 });
              enemies.splice(i, 1);
              break;
            }
          }
        }

        // Enemy Crash with Player
        if (invincibleTimer <= 0 && Math.hypot(player.x - e.x, player.y - e.y) < 28) {
          lives--;
          document.getElementById('lives-val').textContent = lives;
          playSfx(120, 0.4);
          for (let p=0; p<10; p++) particles.push({ x: player.x, y: player.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, color:'#00f5ff', life:1 });
          if (lives <= 0) {
            isGameOver = true;
            document.getElementById('final-score').textContent = score;
            document.getElementById('modal').style.display = 'flex';
            return;
          }
          invincibleTimer = 90;
        }

        if (e.y > 840) enemies.splice(i, 1);
      }

      // Update Enemy Bullets
      for (let i = eBullets.length - 1; i >= 0; i--) {
        const eb = eBullets[i];
        eb.y += eb.vy;
        if (invincibleTimer <= 0 && Math.hypot(player.x - eb.x, player.y - eb.y) < 18) {
          lives--;
          document.getElementById('lives-val').textContent = lives;
          playSfx(120, 0.4);
          for (let p=0; p<10; p++) particles.push({ x: player.x, y: player.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, color:'#00f5ff', life:1 });
          eBullets.splice(i, 1);
          if (lives <= 0) {
            isGameOver = true;
            document.getElementById('final-score').textContent = score;

            if (window.ArcadeLeaderboard) {
              window.ArcadeLeaderboard.show({
                gameId: 'sky-ace-1944',
                score: score,
                scoreUnit: 'PTS',
                onRestart: resetGame
              });
            } else {
              document.getElementById('modal').style.display = 'flex';
            }
            return;
          }
          invincibleTimer = 90;
          continue;
        }
        if (eb.y > 840) eBullets.splice(i, 1);
      }

      // Render
      ctx.fillStyle = '#0a101f'; ctx.fillRect(0, 0, 600, 800);

      // Parallax Stars / Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      for (let s = 0; s < 25; s++) {
        const sx = (s * 73 + Date.now() * 0.05) % 600;
        const sy = (s * 97 + Date.now() * 0.2) % 800;
        ctx.fillRect(sx, sy, 3, 3);
      }

      // Draw Player Fighter
      if (invincibleTimer % 6 < 3 || invincibleTimer <= 0) {
        ctx.fillStyle = '#00f5ff';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - 24);
      ctx.lineTo(player.x - 20, player.y + 16);
      ctx.lineTo(player.x, player.y + 8);
      ctx.lineTo(player.x + 20, player.y + 16);
      ctx.closePath();
      ctx.fill();
      // Cockpit
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(player.x, player.y - 4, 5, 0, Math.PI*2); ctx.fill();
      }
      // Draw Player Bullets
      ctx.fillStyle = '#fffb00';
      ctx.shadowColor = '#fffb00'; ctx.shadowBlur = 10;
      for (const b of bullets) { ctx.fillRect(b.x - 2, b.y - 6, 4, 12); }
      ctx.shadowBlur = 0;

      // Draw Enemies
      for (const e of enemies) {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + 18);
        ctx.lineTo(e.x - 18, e.y - 14);
        ctx.lineTo(e.x + 18, e.y - 14);
        ctx.closePath();
        ctx.fill();
      }

      // Draw Enemy Bullets
      ctx.fillStyle = '#ff4757';
      ctx.shadowColor = '#ff4757'; ctx.shadowBlur = 8;
      for (const eb of eBullets) { ctx.beginPath(); ctx.arc(eb.x, eb.y, 5, 0, Math.PI*2); ctx.fill(); }
      ctx.shadowBlur = 0;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }

      document.getElementById('score-val').textContent = score;

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
